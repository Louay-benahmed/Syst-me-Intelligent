<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA de Diagnostic Opérationnel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-emerald-800 text-white shadow-md py-5 px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">🔬 Système de Prédiction du Risque Opérationnel</h1>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
        <div class="bg-white rounded-xl shadow-lg p-6 md:p-8 mb-8 border border-gray-100">
            <h2 class="text-xl font-semibold text-gray-800 mb-6 pb-2 border-b">⚙️ Saisie des variables d'évaluation</h2>

            <form id="predictionForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mois d'Extraction (1-12)</label>
                        <input type="number" id="mois" name="mois" min="1" max="12" value="6" required
                            class="w-full rounded-md border-gray-300 shadow-sm p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Délai P1 (Réception -> Début Analyse en Jours)</label>
                        <input type="number" id="p1" name="p1" min="0" value="3" required
                            class="w-full rounded-md border-gray-300 shadow-sm p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Charge Mensuelle globale (Workload)</label>
                        <input type="number" id="workload" name="workload" min="1" value="150" required
                            class="w-full rounded-md border-gray-300 shadow-sm p-2.5 bg-gray-50 focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 border">
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-medium text-gray-800 mb-2">Sélection de l'Architecture Prédictive :</label>
                    <div class="flex space-x-6">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="model" value="rf" checked class="text-emerald-700 focus:ring-emerald-600 h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700 font-medium">Random Forest Classifier (Recommandé)</span>
                        </label>
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="radio" name="model" value="svm" class="text-emerald-700 focus:ring-emerald-600 h-4 w-4">
                            <span class="ml-2 text-sm text-gray-700 font-medium">SVM (Optimisé RBF Calibré)</span>
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold p-3 rounded-lg shadow transition duration-200">
                    Calculer l'Indice de Risque Opérationnel
                </button>
            </form>
        </div>

        <div id="resultBlock" class="hidden bg-white rounded-xl shadow-lg p-6 md:p-8 border-t-4 transition duration-300">
            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                📊 Résultat de l'analyse IA
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="p-5 rounded-lg flex flex-col justify-center items-center text-center" id="classCard">
                    <span class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-1">Classe Prédite</span>
                    <div id="predictionResult" class="text-xl font-bold text-gray-900">N/A</div>
                </div>

                <div class="p-5 bg-gray-50 rounded-lg border border-gray-200 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-semibold text-gray-600">Score de Confiance :</span>
                            <span id="confidencePercentage" class="text-sm font-bold text-emerald-800">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2.5">
                            <div id="confidenceBar" class="bg-emerald-700 h-2.5 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>

                    <div id="douteAlert" class="mt-3 text-xs p-2 rounded hidden"></div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-100">
                <h4 class="text-sm font-semibold text-gray-700 mb-3">Répartition des probabilités par catégorie :</h4>
                <div id="probabilitiesBreakdown" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <footer class="bg-emerald-800 text-gray-400 text-center py-4 text-xs">
        &copy; 2026 Système d'Analyse Prédictive IA. Conforme aux protocoles académiques.
    </footer>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Collect Form Values
            const payload = {
                mois: document.getElementById('mois').value,
                p1: document.getElementById('p1').value,
                workload: document.getElementById('workload').value,
                model: document.querySelector('input[name="model"]:checked').value
            };

            const resultBlock = document.getElementById('resultBlock');
            const classCard = document.getElementById('classCard');
            const douteAlert = document.getElementById('douteAlert');

            try {
                // Query Backend Web API API
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const resData = await response.json();

                if (!resData.success) throw new Error(resData.error);

                // Show Results Module Block
                resultBlock.classList.remove('hidden');

                // Apply Color styling dynamically according to prediction risk outputs
                classCard.className = "p-5 rounded-lg flex flex-col justify-center items-center text-center border ";
                if (resData.prediction_class === 0) { // Rapide
                    resultBlock.className = "bg-white rounded-xl shadow-lg p-6 md:p-8 border-t-4 border-green-500";
                    classCard.classList.add("bg-green-50", "border-green-200", "text-green-800");
                } else if (resData.prediction_class === 1) { // Standard
                    resultBlock.className = "bg-white rounded-xl shadow-lg p-6 md:p-8 border-t-4 border-emerald-600";
                    classCard.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-950");
                } else { // Critique (Classe 2)
                    resultBlock.className = "bg-white rounded-xl shadow-lg p-6 md:p-8 border-t-4 border-red-500";
                    classCard.classList.add("bg-red-50", "border-red-200", "text-red-800");
                }

                // Append strings values inside HTML items
                document.getElementById('predictionResult').innerText = resData.prediction_label;

                // Update interactive confidence parameters bars
                const confidencePct = (resData.confidence * 100).toFixed(1) + '%';
                document.getElementById('confidencePercentage').innerText = confidencePct;
                document.getElementById('confidenceBar').style.width = confidencePct;

                // Handle Doute Zone evaluation parameters (< 55% as per operational scripts specs)
                if (resData.confidence < 0.55) {
                    douteAlert.className = "mt-3 text-xs p-2 rounded bg-yellow-100 text-yellow-800 font-medium block";
                    douteAlert.innerText = "⚠️ Attention : Cette prédiction est située en zone de doute critique (< 55%).";
                } else {
                    douteAlert.className = "hidden";
                }
                // Render detail breakdown list items
                // Render detail breakdown list items
                let probabilitiesHTML = '';
                for (const [lbl, val] of Object.entries(resData.all_probabilities)) {
                    probabilitiesHTML += `
                        <div class="flex items-center text-sm text-gray-600">
                            <span class="w-1/3 truncate font-medium">${lbl} :</span>
                            <div class="w-2/3 flex items-center space-x-2">
                                <div class="bg-gray-200 w-full rounded-full h-1.5">
                                    <div class="bg-gray-500 h-1.5 rounded-full" style="width: ${(val*100)}%"></div>
                                </div>
                                <span class="text-xs font-mono w-10 text-right">${(val*100).toFixed(1)}%</span>
                            </div>
                        </div>`;
                }
                document.getElementById('probabilitiesBreakdown').innerHTML = probabilitiesHTML;

                // Scroll view smoothly down into the response dashboard
                resultBlock.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert("Erreur lors du calcul de prédiction : " + err.message);
            }
        });
    </script>
</body>
</html>
